<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Detran - Departamento de Trânsito</h1>
    <p>Velocidade do Carro: <input type="number" name="velocidade" id="velocidade"> km/h <input type="button" value="verificar" onclick="calcular()"></p> 
    <p id="resposta"></p>

    <script>
        function calcular(){
            var velocidade = window.document.getElementById('velocidade').value
            if(velocidade > 80){
                window.document.getElementById('resposta').innerHTML = 'Multado! Você excedeu o limite permitido que é de 80km/h'
            } else {
                window.document.getElementById('resposta').innerHTML = 'Parabéns, você está dentro do limite de velocidade!'
            }
        }
    </script>
</body>
</html>
